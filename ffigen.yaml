# To execute ffigen you must download llama.cpp:
# 1. cd src
# 2. mkdir build
# 3. cd build
# 4. cmake ..
# 5. cd ../../
# Run with `dart run ffigen --config ffigen.yaml`.
name: llamacpp
description: |
  Bindings for `llama.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/bind/llama_binding.dart'
headers:
  entry-points:
    - 'src/llama.cpp/include/llama.h'
compiler-opts:
  - "-Isrc/llama.cpp/ggml/include"
  - "-Isrc/llama.cpp/include"
  
  # Use this if ffigen can not find clang include files by itself
  # Uncoment it and change the clang version
  # Or run 'clang -print-resource-dir' and copy the result to this line
  # - '-I/usr/lib/clang/22/include'

preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_element
  // ignore_for_file: unused_field
comments:
  style: any
  length: full
